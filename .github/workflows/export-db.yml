# Експорт бази (Firestore) у файл data/state.json —
# щоб ШІ (Claude) бачив ваші лайки, нотатки, сценарії і завдання.
name: export-db

on:
  schedule:
    - cron: '30 8 * * *'    # 11:30 за Києвом (влітку) — перед щоденною генерацією
    - cron: '0 17 * * *'    # 20:00 за Києвом — вечірній зріз лайків і нотаток
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Встановити firebase-admin
        run: npm install firebase-admin@12 --no-audit --no-fund

      - name: Вивантажити базу
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/export-db.js

      - name: Зберегти в репозиторій
        run: |
          git config user.name "smm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json
          git commit -m "export: свіжий стан бази" || exit 0
          git push
